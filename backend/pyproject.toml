[project]
name = "expense-splitter-backend"
version = "0.1.0"
description = "EntreNos - Expense Splitter backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["expense_splitter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"